- name: verify | kube_master
  hosts: kube_master
  remote_user: root
  become: true
  tasks:
    - name: kubectl version --output=yaml
      ansible.builtin.command:
        cmd: kubectl version --output=yaml
      register: result
      changed_when: result is not succeeded

    - name: kubectl get pod --all-namespaces
      ansible.builtin.shell:
        cmd: |
          set -euxo pipefail
          kubectl get pod --all-namespaces | egrep -e 'nginx-gateway\s+nginx-gateway-fabric-\S+\s+[0-9]+\/[0-9]+\s+Running'
      args:
        executable: /bin/bash
      when: inventory_hostname == groups['kube_master'][0]
      register: result
      changed_when: result is not succeeded
      until: result is succeeded
      retries: 60

    - name: create gateway
      vars:
        ansible_python_interpreter: python3
      kubernetes.core.k8s:
        state: present
        wait: true
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: nginx-gateway
            namespace: nginx-gateway
          spec:
            gatewayClassName: nginx
            allowedListeners:
              namespaces:
                from: All
            listeners:
              - name: http
                protocol: HTTP
                port: 80
                allowedRoutes:
                  namespaces:
                    from: All
              - name: https
                protocol: HTTPS
                port: 443
                allowedRoutes:
                  namespaces:
                    from: All
                tls:
                  certificateRefs:
                    - name: server-tls
                      kind: Secret
                      group: ""
      when: inventory_hostname == groups['kube_master'][0]
      register: result
      changed_when: result is not succeeded
      until: result is succeeded
      retries: 60

    - name: create pod
      vars:
        ansible_python_interpreter: python3
      kubernetes.core.k8s:
        state: present
        wait: true
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: nginx
            namespace: default
            labels:
              app: nginx
          spec:
            containers:
              - name: nginx
                image: docker.io/library/nginx:latest
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 80
      when: inventory_hostname == groups['kube_master'][0]
      register: result
      changed_when: result is not succeeded
      until: result is succeeded
      retries: 60

    - name: create service
      vars:
        ansible_python_interpreter: python3
      kubernetes.core.k8s:
        state: present
        wait: true
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx
            namespace: default
          spec:
            ports:
              - name: nginx
                port: 80
                targetPort: 80
            selector:
              app: nginx
            type: ClusterIP
      when: inventory_hostname == groups['kube_master'][0]
      register: result
      changed_when: result is not succeeded
      until: result is succeeded
      retries: 60

    - name: create httproute
      vars:
        ansible_python_interpreter: python3
      kubernetes.core.k8s:
        state: present
        wait: true
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: nginx-gateway
            namespace: default
          spec:
            hostnames:
              - "{{ inventory_hostname }}"
            parentRefs:
              - name: nginx-gateway
                namespace: nginx-gateway
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: nginx
                    port: 80
      when: inventory_hostname == groups['kube_master'][0]
      register: result
      changed_when: result is not succeeded
      until: result is succeeded
      retries: 60

    - name: curl -skL
      ansible.builtin.shell:
        cmd: |
          set -euxo pipefail
          curl -skL https://{{ inventory_hostname }}
          curl -skI https://{{ inventory_hostname }} | grep -i 'X-Cache-Status'
      args:
        executable: /bin/bash
      when: inventory_hostname == groups['kube_master'][0]
      register: result
      changed_when: result is not succeeded
      until: result is succeeded
      retries: 60
