# Mode defines how NGINX will rewrite the client’s IP address.
helm_nginx_gateway_fabric_rewrite_client_ip_mode_type: XForwardedFor

# SetIPRecursively configures whether recursive search is used when
# selecting the client’s address from the X-Forwarded-For header
helm_nginx_gateway_fabric_rewrite_client_ip_set_ip_recursively: true

# TrustedAddresses specifies the addresses that are trusted to send
# correct client IP information.
helm_nginx_gateway_fabric_rewrite_client_ip_trusted_addresses:
  - type: CIDR
    value: 224.0.0.0/4
  - type: CIDR
    value: 10.0.0.0/8
  - type: CIDR
    value: 172.16.0.0/12
  - type: CIDR
    value: 192.168.0.0/16
  - type: IPAddress
    value: 127.0.0.1

# Release name to manage.
helm_nginx_gateway_fabric_helm_release_name: nginx-gateway-fabric

# Kubernetes namespace where the chart should be installed.
helm_nginx_gateway_fabric_helm_release_namespace: nginx-gateway

# Value to pass to chart.
helm_nginx_gateway_fabric_helm_release_values:
  nginxGateway:
    kind: deployment
    replicas: 1
    image:
      repository: ghcr.io/nginx/nginx-gateway-fabric
      pullPolicy: IfNotPresent
    snippets:
      enable: true
  nginx:
    kind: deployment
    replicas: 1
    pod:
      volumes:
        - name: var-cache-nginx-proxy-cache
          emptyDir:
            medium: Memory
    container:
      volumeMounts:
        - mountPath: /var/cache/nginx/proxy_cache
          name: var-cache-nginx-proxy-cache
    patches:
      - type: StrategicMerge
        value:
          spec:
            template:
              spec:
                hostNetwork: true
                dnsPolicy: ClusterFirstWithHostNet
                securityContext:
                  allowPrivilegeEscalation: true
                  privileged: true
                  sysctls: []
                containers:
                  - name: nginx
                    securityContext:
                      allowPrivilegeEscalation: true
                      privileged: true
                      sysctls: []
    image:
      repository: ghcr.io/nginx/nginx-gateway-fabric/nginx
      pullPolicy: IfNotPresent
    service:
      type: NodePort
    config:
      rewriteClientIP:
        mode: "{{ helm_nginx_gateway_fabric_rewrite_client_ip_mode_type }}"
        setIPRecursively: "{{ helm_nginx_gateway_fabric_rewrite_client_ip_set_ip_recursively }}"
        trustedAddresses: "{{ helm_nginx_gateway_fabric_rewrite_client_ip_trusted_addresses }}"
