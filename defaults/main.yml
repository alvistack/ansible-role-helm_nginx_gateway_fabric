# Mode defines how NGINX will rewrite the client’s IP address.
helm_nginx_gateway_fabric_rewrite_client_ip_mode_type: XForwardedFor

# SetIPRecursively configures whether recursive search is used when
# selecting the client’s address from the X-Forwarded-For header
helm_nginx_gateway_fabric_rewrite_client_ip_set_ip_recursively: true

# TrustedAddresses specifies the addresses that are trusted to send
# correct client IP information.
helm_nginx_gateway_fabric_rewrite_client_ip_trusted_addresses:
  - type: CIDR
    value: 224.0.0.0/4
  - type: CIDR
    value: 10.0.0.0/8
  - type: CIDR
    value: 172.16.0.0/12
  - type: CIDR
    value: 192.168.0.0/16
  - type: IPAddress
    value: 127.0.0.1

# Release name to manage.
helm_nginx_gateway_fabric_helm_release_name: nginx-gateway-fabric

# Kubernetes namespace where the chart should be installed.
helm_nginx_gateway_fabric_helm_release_namespace: nginx-gateway

# Value to pass to chart.
helm_nginx_gateway_fabric_helm_release_values:
  nginxGateway:
    kind: deployment
    replicas: 1
    image:
      repository: ghcr.io/nginx/nginx-gateway-fabric
      pullPolicy: IfNotPresent
    snippets:
      enable: true
  nginx:
    kind: deployment
    replicas: 1
    pod:
      volumes:
        - name: var-cache-nginx-proxy-cache
          emptyDir:
            medium: Memory
    container:
      volumeMounts:
        - mountPath: /var/cache/nginx/proxy_cache
          name: var-cache-nginx-proxy-cache
    patches:
      - type: StrategicMerge
        value:
          spec:
            template:
              spec:
                hostNetwork: true
                dnsPolicy: ClusterFirstWithHostNet
                securityContext:
                  allowPrivilegeEscalation: true
                  privileged: true
                  sysctls: []
                containers:
                  - name: nginx
                    securityContext:
                      allowPrivilegeEscalation: true
                      privileged: true
                      sysctls: []
    image:
      repository: ghcr.io/nginx/nginx-gateway-fabric/nginx
      pullPolicy: IfNotPresent
    service:
      type: NodePort
    config:
      rewriteClientIP:
        mode: "{{ helm_nginx_gateway_fabric_rewrite_client_ip_mode_type }}"
        setIPRecursively: "{{ helm_nginx_gateway_fabric_rewrite_client_ip_set_ip_recursively | bool | lower }}"
        trustedAddresses: "{{ helm_nginx_gateway_fabric_rewrite_client_ip_trusted_addresses }}"
  extraObjects:
    - |
      apiVersion: gateway.nginx.org/v1alpha1
      kind: SnippetsPolicy
      metadata:
        name: global-policy
        namespace: nginx-gateway
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: nginx-gateway
        snippets:
          - context: http
            value: |
              gzip on;
              proxy_buffering on;
              proxy_cache_path /var/cache/nginx/proxy_cache levels=1:2 keys_zone=cache:10m max_size=128m inactive=10m use_temp_path=off;
              proxy_cache_key "$scheme$request_method$proxy_host$request_uri$http_origin";
          - context: http.server.location
            value: |
              http2 off;
              add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
              proxy_cache cache;
              proxy_cache_valid 200 1s;
              proxy_cache_lock on;
              proxy_ignore_headers Set-Cookie Cache-Control Expires;
              proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
              add_header 'X-Cache-Status' $upstream_cache_status always;
              add_header 'Access-Control-Allow-Origin' $http_origin always;
              add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
              add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
              add_header 'Access-Control-Allow-Credentials' 'true' always;
              add_header 'Vary' 'Origin' always;
